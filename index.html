<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a111f">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="随身知识库">
<meta name="format-detection" content="telephone=no">
<title>随身知识库 · 碎片时间学习</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">库</span>
      <div class="brand-text"><b>随身知识库</b><small>碎片时间 · 概念 · 精讲 · 刷题</small></div>
    </div>
    <div class="top-right">
      <span id="streakPill" class="tag" style="font-size:12px"></span>
      <button class="icon-btn" data-action="toggle-theme" aria-label="切换主题">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="tab active" data-route="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-route="learn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21V5.5Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/><path d="M8 7h8M8 10.5h5"/></svg>
      <span>学习</span>
    </button>
    <button class="tab" data-route="lessons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z"/></svg>
      <span>精讲</span>
    </button>
    <button class="tab" data-route="quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 9a2.5 2.5 0 0 1 5 .2c0 1.8-2.5 2.3-2.5 3.8"/><circle cx="12" cy="17.6" r=".4" fill="currentColor"/><circle cx="12" cy="12" r="9"/></svg>
      <span>刷题</span>
    </button>
    <button class="tab" data-route="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<div id="practice" class="practice" hidden aria-modal="true" role="dialog"></div>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="reader" class="practice" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="app.js"></script>
</body>
</html>
